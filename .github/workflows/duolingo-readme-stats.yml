
name: Duolingo README Stats Action

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with Duolingo stats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Duolingo stats
        uses: centrumek/duolingo-readme-stats@v1.0.0
        with:
          DUOLINGO_USER_ID: ${{ secrets.DUOLINGO_USER_ID }}
          ADVANCED_TOKEN_JWT: ${{ secrets.ADVANCED_TOKEN_JWT }}
