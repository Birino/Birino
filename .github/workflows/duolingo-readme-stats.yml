

name: Duolingo README Stats Action

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Duolingo stats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Duolingo stats
        uses: centrumek/duolingo-readme-stats@main
        with:
          DUOLINGO_USER_ID: ${{ secrets.DUOLINGO_USER_ID }}
          ADVANCED_TOKEN_JWT: ${{ secrets.ADVANCED_TOKEN_JWT }}

      - name: Generate modern Duolingo cards
        shell: bash
        run: |
          python3 <<'PY'
          import re
          import html
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          start = "<!--START_SECTION:duolingoStats-->"
          end = "<!--END_SECTION:duolingoStats-->"

          if start not in content or end not in content:
              raise SystemExit("Marcadores do Duolingo não encontrados.")

          section_start = content.index(start) + len(start)
          section_end = content.index(end, section_start)
          section = content[section_start:section_end]

          def clean(cell):
              cell = re.sub(r"<img\b[^>]*>", "", cell, flags=re.I)
              cell = re.sub(r"<[^>]+>", "", cell)
              return html.unescape(cell).strip()

          tables = []
          current = []

          for line in section.splitlines():
              if line.strip().startswith("|"):
                  current.append(line.strip())
              elif current:
                  tables.append(current)
                  current = []

          if current:
              tables.append(current)

          parsed = []

          for table in tables:
              rows = []
              for line in table:
                  cells = [clean(c) for c in line.strip("|").split("|")]
                  if all(re.fullmatch(r"[\s:—-]*", c) for c in cells):
                      continue
                  rows.append(cells)
              parsed.append(rows)

          summary = None
          languages = []

          for rows in parsed:
              for row in rows:
                  if len(row) == 5 and row[0].lower() not in ("username", "nome de usuário"):
                      summary = row
                  elif len(row) == 2 and row[0].lower() not in ("language", "linguagem"):
                      if row[0] and row[1]:
                          languages.append(row)

          if not summary:
              raise SystemExit(
                  "Não consegui ler a tabela principal do Duolingo. "
                  "O README original foi preservado."
              )

          username, streak, total_xp, weekly_xp, league = summary

          def esc(value):
              return html.escape(str(value), quote=True)

          height = 400 + len(languages) * 42
          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="900" height="{height}" viewBox="0 0 900 {height}">',
              '<rect width="900" height="100%" rx="24" fill="#F0FDF4"/>',
              '<rect x="1" y="1" width="898" height="100%" rx="23" fill="none" stroke="#BBF7D0" stroke-width="2"/>',
              '<text x="30" y="43" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#166534">DUOLINGO DASHBOARD</text>',
              f'<text x="32" y="69" font-family="Arial,sans-serif" font-size="14" fill="#4D7C0F">{esc(username)} · Seu progresso nos idiomas</text>',
          ]

          cards = [
              ("OFENSIVA", streak, "dias consecutivos", "#16A34A", "#FFFFFF"),
              ("XP TOTAL", total_xp, "experiência acumulada", "#FFFFFF", "#166534"),
              ("XP DA SEMANA", weekly_xp, "experiência semanal", "#FFFFFF", "#166534"),
              ("LIGA ATUAL", league, "sua liga no Duolingo", "#FFFFFF", "#166534"),
          ]

          for i, (label, value, caption, bg, fg) in enumerate(cards):
              x = 25 + i * 218
              svg.append(
                  f'<rect x="{x}" y="90" width="204" height="112" rx="16" fill="{bg}" stroke="#86EFAC" stroke-width="1.5"/>'
              )
              label_color = "#DCFCE7" if i == 0 else "#65A30D"
              caption_color = "#ECFDF5" if i == 0 else "#64748B"
              svg.append(
                  f'<text x="{x+15}" y="116" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="{label_color}">{esc(label)}</text>'
              )
              value_size = 24 if len(str(value)) > 11 else 31
              svg.append(
                  f'<text x="{x+15}" y="153" font-family="Arial,sans-serif" font-size="{value_size}" font-weight="700" fill="{fg}">{esc(value)}</text>'
              )
              svg.append(
                  f'<text x="{x+15}" y="179" font-family="Arial,sans-serif" font-size="11" fill="{caption_color}">{esc(caption)}</text>'
              )

          lang_y = 242
          svg.append(
              f'<text x="30" y="{lang_y}" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#166534">IDIOMAS EM ESTUDO</text>'
          )

          if languages:
              for i, (language, xp) in enumerate(languages):
                  y = lang_y + 18 + i * 42
                  svg.append(
                      f'<rect x="25" y="{y}" width="850" height="34" rx="9" fill="#FFFFFF" stroke="#DCFCE7"/>'
                  )
                  svg.append(
                      f'<text x="40" y="{y+22}" font-family="Arial,sans-serif" font-size="14" fill="#166534">{esc(language)}</text>'
                  )
                  svg.append(
                      f'<text x="850" y="{y+22}" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#15803D">{esc(xp)} XP</text>'
                  )
          else:
              svg.append(
                  f'<text x="30" y="{lang_y+30}" font-family="Arial,sans-serif" font-size="13" fill="#64748B">Dados de idiomas não encontrados nesta atualização.</text>'
              )
          svg.append(f'<rect x="1" y="{height-2}" width="898" height="2" fill="#F0FDF4"/>')
          svg.append('</svg>')
          Path("duolingo-stats.svg").write_text("\n".join(svg), encoding="utf-8")

          image = (
              '\n\n<div align="center">\n'
              '  <img src="https://raw.githubusercontent.com/Birino/Birino/main/duolingo-stats.svg" '
              'width="100%" alt="Estatísticas do Duolingo: ofensiva, XP e idiomas" />\n'
              '</div>\n\n'
          )

          updated = content[:section_start] + image + content[section_end:]
          readme.write_text(updated, encoding="utf-8")
          print("Cards do Duolingo gerados com sucesso.")
          PY

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md duolingo-stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update modern Duolingo stats cards"
            git push
          else
            echo "Nenhuma alteração nas estatísticas."
          fi

